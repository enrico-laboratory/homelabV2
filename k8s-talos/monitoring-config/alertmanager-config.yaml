apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: telegram-config
  namespace: monitoring
spec:
  route:
    receiver: telegram
    groupBy: ["alertname", "namespace"]
    # Watchdog always fires (dead man's switch) and InfoInhibitor is internal: keep them out of Telegram
    matchers:
      - name: alertname
        value: Watchdog|InfoInhibitor
        matchType: "!~"
  receivers:
    - name: telegram
      telegramConfigs:
        - chatID: 5135976074
          botToken:
            name: telegram-bot-token-secret
            key: token
