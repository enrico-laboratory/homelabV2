apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: sergelogvinov
  namespace: proxmox-csi
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/sergelogvinov/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: proxmox-csi
  namespace: proxmox-csi
spec:
  interval: 30m
  chart:
    spec:
      chart: proxmox-csi-plugin
      version: 0.5.15
      sourceRef:
        kind: HelmRepository
        name: sergelogvinov
  values:
    existingConfigSecret: proxmox-csi-config
    controller:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
    node:
      nodeSelector:
        kubernetes.io/os: linux
    # Ported from k8s/argocd-apps/tooling/proxmox-csi-plugin.yaml; the vmimages class is dropped on purpose
    storageClass:
      - name: proxmox-zfs-nvme
        storage: kubedata
        reclaimPolicy: Delete
        fstype: ext4
        ssd: true
        backup: false
        mountOptions:
          - discard
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
      - name: proxmox-zfs-kubedata-ext4
        storage: kubedata
        reclaimPolicy: Delete
        fstype: ext4
        ssd: true
        cache: writethrough
        backup: false
        mountOptions:
          - discard
