apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nvidia-device-plugin
  namespace: nvidia
spec:
  interval: 1h
  url: https://nvidia.github.io/k8s-device-plugin
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: nvidia
spec:
  interval: 30m
  chart:
    spec:
      chart: nvidia-device-plugin
      version: 0.18.0
      sourceRef:
        kind: HelmRepository
        name: nvidia-device-plugin
  values:
    runtimeClassName: nvidia
    priorityClassName: system-node-critical
    # label set by talos_tf on nodes with gpu = true (the chart tolerates the nvidia.com/gpu taint)
    nodeSelector:
      nvidia.com/gpu.present: "true"
    # Time-slicing: the single GPU is advertised as 4 nvidia.com/gpu so ollama, comfyui and Immich ML can
    # share it. No VRAM isolation between the pods (12 GB total).
    config:
      default: default
      map:
        default: |-
          version: v1
          sharing:
            timeSlicing:
              renameByDefault: false
              failRequestsGreaterThanOne: false
              resources:
                - name: nvidia.com/gpu
                  replicas: 4
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: dcgm-exporter
  namespace: nvidia
spec:
  interval: 1h
  url: https://nvidia.github.io/dcgm-exporter/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dcgm-exporter
  namespace: nvidia
spec:
  interval: 30m
  dependsOn:
    - name: kube-prometheus-stack
      namespace: monitoring
  chart:
    spec:
      chart: dcgm-exporter
      version: 4.8.1
      sourceRef:
        kind: HelmRepository
        name: dcgm-exporter
  values:
    runtimeClassName: nvidia
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
    nodeSelector:
      nvidia.com/gpu.present: "true"
    # Prometheus selects every ServiceMonitor (serviceMonitorSelectorNilUsesHelmValues: false)
    serviceMonitor:
      enabled: true
