apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 1h
  url: https://kyverno.github.io/kyverno/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: 3.10.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    features:
      # one admission replica: if Kyverno is down, its webhooks must not block Flux, Tuppr drains or pods
      forceFailurePolicyIgnore:
        enabled: true
    admissionController:
      replicas: 1
      serviceMonitor:
        enabled: true
    backgroundController:
      serviceMonitor:
        enabled: true
    cleanupController:
      serviceMonitor:
        enabled: true
    reportsController:
      serviceMonitor:
        enabled: true
---
# Pod Security Standards (baseline) as ClusterPolicies, Audit only: violations land in PolicyReports, nothing is blocked
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  interval: 30m
  dependsOn:
    - name: kyverno
  chart:
    spec:
      chart: kyverno-policies
      version: 3.10.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
  values:
    podSecurityStandard: baseline
    validationFailureAction: Audit
