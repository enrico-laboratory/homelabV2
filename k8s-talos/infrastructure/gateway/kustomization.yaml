# Shared Gateway (Cilium Gateway API). The Gateway API CRDs are installed by Terraform before Flux,
# so no deferred Kustomization is needed. Routes live next to the app they expose.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - gateway.yaml
  - httproute-https-redirect.yaml
