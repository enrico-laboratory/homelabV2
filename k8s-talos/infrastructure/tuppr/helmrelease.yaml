apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tuppr
  namespace: system-upgrade
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/home-operations/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
  namespace: system-upgrade
spec:
  interval: 30m
  chart:
    spec:
      chart: tuppr
      version: 0.5.13
      sourceRef:
        kind: HelmRepository
        name: tuppr
