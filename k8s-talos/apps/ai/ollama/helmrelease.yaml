apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: otwld
  namespace: ai
spec:
  interval: 1h
  url: https://helm.otwld.com/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
  namespace: ai
spec:
  interval: 30m
  chart:
    spec:
      chart: ollama
      version: 1.40.0
      sourceRef:
        kind: HelmRepository
        name: otwld
  values:
    runtimeClassName: nvidia
    image:
      repository: ollama/ollama
      tag: "0.15.0"

    persistentVolume:
      enabled: true
      storageClass: "proxmox-zfs-kubedata-ext4"
      size: 100Gi

    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
    ollama:
      gpu:
        enabled: true
        type: nvidia
        number: 1

      # No models pulled at startup: the pull runs in a postStart hook and keeps the container from
      # becoming ready for the whole download. Pull by hand (kubectl exec deploy/ollama -- ollama pull <model>).
      # Previous list, kept for reference:
      # - llama3.2:1b
      # - llama3.2:3b
      # - llama3.2-vision
      # - nomic-embed-text
      # - qwen3:4b
      # - qwen2.5-coder:7b
      # - qwen2.5-coder:14b
      # - mistral-small
      # - gemma3:12b
      # - orieg/gemma3-tools:12b-ft
      # - dolphin3:8b
      # - dolphin-phi
      models:
        pull: []

    # OLLAMA_HOST is set by the chart (a duplicate entry fails Flux's server-side apply)
    extraEnv:
      - name: OLLAMA_KEEP_ALIVE
        value: "24h"
      - name: OLLAMA_CONTEXT_LENGTH
        value: "64000"
      - name: OLLAMA_FLASH_ATTENTION
        value: '1'

    # exposed through httproute.yaml
    ingress:
      enabled: false
