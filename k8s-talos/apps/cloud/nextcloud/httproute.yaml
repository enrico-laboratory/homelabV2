# Replaces the nginx ingress: proxy-read/send-timeout 3600 -> timeouts.request.
# proxy-body-size 10G needs no equivalent (Envoy streams request bodies).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: cloud
spec:
  parentRefs:
  - name: main
    namespace: gateway
    sectionName: https
  hostnames:
  - nextcloud.enricoruggieri.com
  rules:
  - backendRefs:
    - name: nextcloud
      port: 8080
    timeouts:
      request: 3600s
