apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: onlyoffice
  namespace: cloud
spec:
  parentRefs:
  - name: main
    namespace: gateway
    sectionName: https
  hostnames:
  - onlyoffice.enricoruggieri.com
  rules:
  - backendRefs:
    - name: onlyoffice-service
      port: 80
    timeouts:
      request: 3600s
