# Nightly Immich backup to TrueNAS (restic over NFS).
#   1. dump   : pg_dump of the Immich database
#   2. restic : backup of the original library (NFS, read-only) + the dump, then retention
#   3. check  : fails the job if any step failed (steps 1 and 2 never abort the pod)
# Thumbnails and encoded video live on the immich-cache PVC and are regenerated by Immich, so they are not saved.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-backup
  namespace: photos
spec:
  schedule: "30 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 43200
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: pg-dump
              image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
              command: ["/bin/sh", "-c"]
              args:
                - |
                  pg_dump -h immich-postgres -U immich -d immich -Fc -f /dump/immich.dump || touch /status/failed
                  [ -s /dump/immich.dump ] || touch /status/failed
                  exit 0
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-db
                      key: password
              volumeMounts:
                - { name: dump, mountPath: /dump }
                - { name: status, mountPath: /status }
            - name: restic
              image: restic/restic:0.18.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  restic cat config >/dev/null 2>&1 || restic init || { touch /status/failed; exit 0; }
                  restic backup /data /dump --host immich || { touch /status/failed; exit 0; }
                  restic forget --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune \
                    || touch /status/failed
                  exit 0
              env:
                - { name: RESTIC_REPOSITORY, value: /repo }
                - { name: RESTIC_CACHE_DIR, value: /cache }
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-backup-restic
                      key: password
              volumeMounts:
                - { name: library, mountPath: /data, readOnly: true }
                - { name: dump, mountPath: /dump }
                - { name: status, mountPath: /status }
                - { name: cache, mountPath: /cache }
                - { name: repo, mountPath: /repo }
          containers:
            - name: check
              image: busybox:1.37
              command: ["/bin/sh", "-c"]
              args:
                - if [ -e /status/failed ]; then echo "backup step failed, see init container logs"; exit 1; fi
              volumeMounts:
                - { name: status, mountPath: /status }
          volumes:
            - name: library
              nfs:
                server: nas.enricoruggieri.com
                path: /tank-fast/immich-library
                readOnly: true
            - name: repo
              nfs:
                server: truenas-backup.enricoruggieri.com
                path: /mnt/backup-pool-2/immich
            - name: dump
              emptyDir: {}
            - name: status
              emptyDir: {}
            - name: cache
              emptyDir: {}
