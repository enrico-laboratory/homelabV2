# Immich needs the VectorChord extension, so the stock postgres image does not work.
# Image tag and digest are the ones in Immich's own docker-compose.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  labels:
    app: immich-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      containers:
      - name: postgres
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: immich
        - name: POSTGRES_DB
          value: immich
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: immich-db, key: password}
        - name: POSTGRES_INITDB_ARGS
          value: --data-checksums
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /dev/shm
          name: shm
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "immich", "-d", "immich"]
          periodSeconds: 10
        resources:
          requests:
            memory: 512Mi
            cpu: 100m
          limits:
            memory: 2Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: immich-postgres-data
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
spec:
  selector:
    app: immich-postgres
  ports:
  - port: 5432
    targetPort: 5432
