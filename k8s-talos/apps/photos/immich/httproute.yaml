# Large video uploads and long-lived websocket: same 3600s as Nextcloud (Envoy streams request bodies, no size limit).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: photos
spec:
  parentRefs:
  - name: main
    namespace: gateway
    sectionName: https
  hostnames:
  - photos.enricoruggieri.com
  rules:
  - backendRefs:
    - name: immich-server
      port: 2283
    timeouts:
      request: 3600s
