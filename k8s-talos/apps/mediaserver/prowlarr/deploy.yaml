apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: mediaserver
  labels:
    app: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume: a rolling update deadlocks when the new pod lands on another node
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      containers:
      - name: prowlarr
        image: lscr.io/linuxserver/prowlarr:2.3.0
        ports:
        - containerPort: 9696
          name: http
        env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: TZ
          value: Europe/Amsterdam
        - name: PROWLARR__POSTGRES__HOST
          value: arr-postgres
        - name: PROWLARR__POSTGRES__PORT
          value: '5432'
        - name: PROWLARR__POSTGRES__USER
          value: prowlarr
        - name: PROWLARR__POSTGRES__PASSWORD
          valueFrom:
            secretKeyRef:
              name: arr-postgres-credentials
              key: prowlarr-password
        - name: PROWLARR__POSTGRES__MAINDB
          value: prowlarr-main
        - name: PROWLARR__POSTGRES__LOGDB
          value: prowlarr-log
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /ping
            port: 9696
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: 9696
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: prowlarr-config
