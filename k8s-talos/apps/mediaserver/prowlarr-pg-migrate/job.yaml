# One-shot: load Prowlarr's SQLite data (prowlarr.db) into the shared arr-postgres.
# Prowlarr must be scaled to 0 (it owns the RWO config volume) and must already have run once
# against Postgres so the schema exists (pgloader "data only"). Logs (logs.db) are not migrated.
# Remove this directory once the migration is verified.
apiVersion: batch/v1
kind: Job
metadata:
  name: prowlarr-pg-migrate
  namespace: mediaserver
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: pgloader
          image: ghcr.io/roxedus/pgloader@sha256:1a7a86ad56623c00ee714ee4969913ed5c6f59ac9785073e2ffd1bea9cc54d31
          args:
            - --with
            - quote identifiers
            - --with
            - data only
            - --with
            - truncate
            - /config/prowlarr.db
            - postgresql://prowlarr:$(PGPASSWORD)@arr-postgres:5432/prowlarr-main
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: arr-postgres-credentials, key: prowlarr-password}
          volumeMounts:
            - { name: config, mountPath: /config }
      containers:
        - name: finish
          image: postgres:17.6
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export PGHOST=arr-postgres PGUSER=prowlarr PGDATABASE=prowlarr-main
              # pgloader copies the Ids explicitly: move every serial/identity sequence past MAX("Id")
              psql -v ON_ERROR_STOP=1 <<'SQL'
              DO $$
              DECLARE r record;
              BEGIN
                FOR r IN
                  SELECT c.table_name AS t, pg_get_serial_sequence(format('%I.%I', 'public', c.table_name), c.column_name) AS s
                  FROM information_schema.columns c
                  WHERE c.table_schema = 'public' AND c.column_name = 'Id'
                LOOP
                  IF r.s IS NOT NULL THEN
                    EXECUTE format('SELECT setval(%L, COALESCE((SELECT MAX("Id") FROM %I), 0) + 1, false)', r.s, r.t);
                  END IF;
                END LOOP;
              END $$;
              SQL
              for t in Indexers Applications DownloadClients History Tags Users Config; do
                printf '%s: ' "$t"; psql -Atc "SELECT count(*) FROM \"$t\""
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: arr-postgres-credentials, key: prowlarr-password}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
