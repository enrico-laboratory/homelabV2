# Nightly Radarr config backup (config.xml with API key, Backups/, asp keys). The DB is in arr-postgres (arr-postgres-backup).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: radarr-pvc-backup
  namespace: mediaserver
spec:
  schedule: "25 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          # The PVC is ReadWriteOnce: run on the same node as the app.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app: radarr
          containers:
            - name: backup
              image: restic/restic:0.18.0
              command: ["/bin/sh", "/scripts/backup.sh"]
              env:
                - { name: APP, value: radarr }
                - name: EXCLUDES
                  value: |
                    /data/logs
                    /data/MediaCover
                    /data/Sentry
                    /data/*.pid
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pvc-backup-restic
                      key: password
              volumeMounts:
                - { name: data, mountPath: /data }
                - { name: dump, mountPath: /dump }
                - { name: cache, mountPath: /cache }
                - { name: repos, mountPath: /repos }
                - { name: scripts, mountPath: /scripts, readOnly: true }
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: radarr-pvc-pve
            - name: repos
              nfs:
                server: truenas-backup.enricoruggieri.com
                path: /mnt/backup-pool-2/k8s-pvc
            - name: scripts
              configMap:
                name: pvc-backup-script
            - name: dump
              emptyDir: {}
            - name: cache
              emptyDir: {}
