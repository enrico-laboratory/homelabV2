# Nightly Jellyfin backup: config and data PVCs (users, watch history, plugins). metadata/ (downloaded artwork) and the cache PVC are rebuilt by a library scan.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-pvc-backup
  namespace: mediaserver
spec:
  schedule: "5 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          # The PVC is ReadWriteOnce: run on the same node as the app.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app: jellyfin
          containers:
            - name: backup
              image: restic/restic:0.18.0
              command: ["/bin/sh", "/scripts/backup.sh"]
              env:
                - { name: APP, value: jellyfin }
                - name: EXCLUDES
                  value: |
                    /data/config/cache
                    /data/config/log
                    /data/data/metadata
                    /data/data/transcodes
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pvc-backup-restic
                      key: password
              volumeMounts:
                - { name: config, mountPath: /data/config }
                - { name: data, mountPath: /data/data }
                - { name: dump, mountPath: /dump }
                - { name: cache, mountPath: /cache }
                - { name: repos, mountPath: /repos }
                - { name: scripts, mountPath: /scripts, readOnly: true }
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: jellyfin-pvc-config
            - name: data
              persistentVolumeClaim:
                claimName: jellyfin-pvc-data
            - name: repos
              nfs:
                server: truenas-backup.enricoruggieri.com
                path: /mnt/backup-pool-2/k8s-pvc
            - name: scripts
              configMap:
                name: pvc-backup-script
            - name: dump
              emptyDir: {}
            - name: cache
              emptyDir: {}
