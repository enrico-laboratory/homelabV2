# One-off: fill the Talos web-data-pvc from the latest restic snapshot of the k3s backup
# (restore steps from notes knowledge/karakeep.md). Doubles as a restore test. Remove after the cutover.
# Skips itself once /data/.restored exists, so a re-created Job does not overwrite live data.
apiVersion: batch/v1
kind: Job
metadata:
  name: karakeep-restore-2 # -2: the first run failed on SELinux xattrs (Job specs are immutable)
  namespace: mediaserver
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: restore
          image: restic/restic:0.18.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -e /data/.restored ]; then echo "already restored"; exit 0; fi
              restic snapshots --no-lock --host karakeep --latest 1
              restic restore --no-lock --exclude-xattr "security.*" latest --host karakeep --target /restore
              ls -la /restore/dump /restore/data
              cp /restore/dump/db.db /data/db.db
              rm -f /data/db.db-wal /data/db.db-shm
              rm -rf /data/assets
              cp -a /restore/data/assets /data/assets
              cp /restore/dump/bookmarks.json /data/.restored-bookmarks.json
              date -u > /data/.restored
              ls -la /data
          env:
            - { name: RESTIC_REPOSITORY, value: /repo }
            - { name: RESTIC_CACHE_DIR, value: /cache }
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: karakeep-backup-secrets
                  key: restic_password
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: repo, mountPath: /repo, readOnly: true }
            - { name: restore, mountPath: /restore }
            - { name: cache, mountPath: /cache }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: web-data-pvc
        - name: repo
          nfs:
            server: truenas-backup.enricoruggieri.com
            path: /mnt/backup-pool-2/karakeep
            readOnly: true
        - name: restore
          emptyDir: {}
        - name: cache
          emptyDir: {}
