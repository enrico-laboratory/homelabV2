apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: karakeep-web-ingress
  namespace: mediaserver
spec:
  parentRefs:
  - name: main
    namespace: gateway
    sectionName: https
  hostnames:
  - karakeep.enricoruggieri.com
  rules:
  - backendRefs:
    - name: karakeep-web
      port: 3000
