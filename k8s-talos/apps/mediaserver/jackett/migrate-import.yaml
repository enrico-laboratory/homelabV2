# One-off PVC copy to Talos (scripts/k3s2talos.py migrate-jobs). Remove after the cutover.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-import-jackett-pvc-pve
  namespace: mediaserver
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: copy
        image: alpine:3.22
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          apk add --no-cache tar >/dev/null
          in=/staging/jackett/jackett-pvc-pve.tar
          if [ -e /dst/.k3s-migrated ]; then echo "already imported"; exit 0; fi
          i=0
          until [ -e "$in.done" ]; do
            i=$((i+1)); [ $i -gt 720 ] && { echo "export not found after 2h"; exit 1; }
            sleep 10
          done
          cd /staging/jackett && sha256sum -c jackett-pvc-pve.tar.sha256
          tar --numeric-owner --xattrs -C /dst -xpf "$in"
          date -u > /dst/.k3s-migrated
          ls -la /dst
        volumeMounts:
        - name: data
          mountPath: /dst
        - name: staging
          mountPath: /staging
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: jackett-pvc-pve
      - name: staging
        nfs:
          server: nas.enricoruggieri.com
          path: /tank-data/k8s-migration
