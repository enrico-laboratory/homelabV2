apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: mediaserver
  labels:
    app: sonarr
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume: a rolling update deadlocks when the new pod lands on another node
    rollingUpdate: null
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
      - name: sonarr
        image: ghcr.io/linuxserver/sonarr:4.0.16
        env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: TZ
          value: Europe/Amsterdam
        - name: SONARR__POSTGRES__HOST
          value: arr-postgres
        - name: SONARR__POSTGRES__PORT
          value: '5432'
        - name: SONARR__POSTGRES__USER
          value: sonarr
        - name: SONARR__POSTGRES__PASSWORD
          valueFrom:
            secretKeyRef:
              name: arr-postgres-credentials
              key: sonarr-password
        - name: SONARR__POSTGRES__MAINDB
          value: sonarr-main
        - name: SONARR__POSTGRES__LOGDB
          value: sonarr-log
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /tv
          name: tvshows
        - mountPath: /downloads
          name: downloads
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sonarr-pvc-pve
      - name: tvshows
        nfs:
          server: nas.enricoruggieri.com
          path: /tank-data/media/tv-shows
          readOnly: false
      - name: downloads
        nfs:
          server: nas.enricoruggieri.com
          path: /tank-data/media/torrents/
