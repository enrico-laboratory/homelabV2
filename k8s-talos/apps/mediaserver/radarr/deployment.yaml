apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: mediaserver
  labels:
    app: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume: a rolling update deadlocks when the new pod lands on another node
    rollingUpdate: null
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
      - name: radarr
        image: ghcr.io/linuxserver/radarr:6.0.4
        env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: TZ
          value: Europe/Amsterdam
        - name: RADARR__POSTGRES__HOST
          value: arr-postgres
        - name: RADARR__POSTGRES__PORT
          value: '5432'
        - name: RADARR__POSTGRES__USER
          value: radarr
        - name: RADARR__POSTGRES__PASSWORD
          valueFrom:
            secretKeyRef:
              name: arr-postgres-credentials
              key: radarr-password
        - name: RADARR__POSTGRES__MAINDB
          value: radarr-main
        - name: RADARR__POSTGRES__LOGDB
          value: radarr-log
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /movies
          name: movies
        - mountPath: /downloads
          name: downloads
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: radarr-pvc-pve
      - name: movies
        nfs:
          server: nas.enricoruggieri.com
          path: /tank-data/media/movies
      - name: downloads
        nfs:
          server: nas.enricoruggieri.com
          path: /tank-data/media/torrents/
