# Nightly dump of the shared *arr Postgres to TrueNAS (restic over NFS).
#   1. dump   : pg_dumpall (roles + all databases)
#   2. restic : backup of the dump, then retention
#   3. check  : fails the job if any step failed (steps 1 and 2 never abort the pod)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arr-postgres-backup
  namespace: mediaserver
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: dump
              image: postgres:17.6
              command: ["/bin/sh", "-c"]
              args:
                - |
                  pg_dumpall -h arr-postgres -U postgres --clean --if-exists > /dump/arr.sql || touch /status/failed
                  [ -s /dump/arr.sql ] || touch /status/failed
                  exit 0
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: arr-postgres-backup-secrets
                      key: postgres_password
              volumeMounts:
                - { name: dump, mountPath: /dump }
                - { name: status, mountPath: /status }
            - name: restic
              image: restic/restic:0.18.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  restic cat config >/dev/null 2>&1 || restic init || { touch /status/failed; exit 0; }
                  restic backup /dump --host arr-postgres || { touch /status/failed; exit 0; }
                  restic forget --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune \
                    || touch /status/failed
                  exit 0
              env:
                - { name: RESTIC_REPOSITORY, value: /repo }
                - { name: RESTIC_CACHE_DIR, value: /cache }
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: arr-postgres-backup-secrets
                      key: restic_password
              volumeMounts:
                - { name: dump, mountPath: /dump }
                - { name: status, mountPath: /status }
                - { name: cache, mountPath: /cache }
                - { name: repo, mountPath: /repo }
          containers:
            - name: check
              image: alpine:3.22
              command: ["/bin/sh", "-c"]
              args:
                - |
                  if [ -e /status/failed ]; then echo "backup step failed, see init container logs"; exit 1; fi
              volumeMounts:
                - { name: status, mountPath: /status }
          volumes:
            - name: repo
              nfs:
                server: truenas-backup.enricoruggieri.com
                path: /mnt/backup-pool-2/arr-postgres
            - name: dump
              emptyDir: {}
            - name: status
              emptyDir: {}
            - name: cache
              emptyDir: {}
