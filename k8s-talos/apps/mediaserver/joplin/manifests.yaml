apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi # 1Gi on k3s, where the database had grown to ~960M
  storageClassName: proxmox-zfs-nvme
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  strategy:
    type: Recreate # RWO volume: a rolling update deadlocks when the new pod lands on another node
    rollingUpdate: null
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: joplin
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: joplin-postgres-credentials
              key: postgres-password
        - name: POSTGRES_DB
          value: joplin
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-storage
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-data
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: joplin
spec:
  selector:
    app: joplin
  ports:
  - port: 22300
    targetPort: 22300
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: joplin
spec:
  selector:
    matchLabels:
      app: joplin
  template:
    metadata:
      labels:
        app: joplin
    spec:
      containers:
      - name: joplin
        image: joplin/server:3.7.6
        ports:
        - containerPort: 22300
        env:
        - name: APP_PORT
          value: '22300'
        - name: APP_BASE_URL
          value: https://joplin.enricoruggieri.com
        - name: MAILER_ENABLED
          value: 'false'
        - name: DB_CLIENT
          value: pg
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: joplin-postgres-credentials
              key: postgres-password
        - name: POSTGRES_DATABASE
          value: joplin
        - name: POSTGRES_USER
          value: joplin
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_HOST
          value: postgres
  replicas: 1
