# Same namespace as the hubble-ui Service, so no ReferenceGrant is needed
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: main
      namespace: gateway
      sectionName: https
  hostnames:
    - hubble.enricoruggieri.com
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
