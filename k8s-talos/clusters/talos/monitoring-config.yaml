# CRD-dependent monitoring objects (AlertmanagerConfig, PodMonitor, ServiceMonitor). Kept apart from
# `infrastructure` because the CRDs come from the kube-prometheus-stack HelmRelease and Flux's
# dry-run would fail the whole infrastructure Kustomization until they exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./k8s-talos/monitoring-config
  prune: true
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
