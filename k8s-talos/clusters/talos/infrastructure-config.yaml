# Objects whose CRDs come from a HelmRelease in `infrastructure` (cert-manager ClusterIssuer). Kept apart
# because Flux's dry-run would fail the whole infrastructure Kustomization until those CRDs exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./k8s-talos/infrastructure-config
  prune: true
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
