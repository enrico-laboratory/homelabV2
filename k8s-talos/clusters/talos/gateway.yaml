# CRD-dependent ingress objects (ClusterIssuer, Gateway, HTTPRoute). Kept apart from `infrastructure`
# because the cert-manager CRDs come from its HelmRelease (Gateway API CRDs come from Terraform).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./k8s-talos/gateway
  prune: true
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
