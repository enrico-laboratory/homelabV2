# Photo apps (Immich).
# After infrastructure-config: HTTPRoutes attach to gateway/main, which needs the cert-manager issuer.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-photos
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./k8s-talos/apps/photos
  prune: true
  wait: false
  dependsOn:
    - name: infrastructure-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
