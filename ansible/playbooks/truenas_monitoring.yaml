# Monitoring for truenas-backup (TrueNAS SCALE appliance: read-only rootfs, no root for us, so everything
# lives in a directory under the user's home and is started from TrueNAS itself).
#
# This playbook (runs as eruggieri, no root) installs node_exporter + the metrics scripts. Two entries must
# then be created ONCE in the TrueNAS UI (System Settings > Advanced), see the debug message at the end:
#   - Init Script (post init): starts node_exporter
#   - Cron Job (root, every 5 min): runs the SMART script (smartctl needs root) and the ZFS script
#
# NOTE: the home directory is on backup-pool-1, which is being replaced; move monitoring_dir when it is.
- name: truenas-backup monitoring files
  hosts: truenas
  gather_facts: true
  vars:
    node_exporter_version: "1.9.1"
    monitoring_dir: "{{ ansible_env.HOME }}/monitoring"
  tasks:
    - name: Create directories
      ansible.builtin.file:
        path: "{{ monitoring_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: [bin, textfile]

    - name: Download node_exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        checksum: "sha256:https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/sha256sums.txt"
        mode: "0644"

    - name: Install the node_exporter binary
      ansible.builtin.unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        dest: "{{ monitoring_dir }}/bin"
        remote_src: true
        extra_opts: ["--strip-components=1", "--wildcards", "*/node_exporter"]
        creates: "{{ monitoring_dir }}/bin/node_exporter"

    - name: Copy the metrics scripts
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ monitoring_dir }}/bin/{{ item.dest }}"
        mode: "0755"
      loop:
        - { src: "{{ playbook_dir }}/roles/nas_maintenance/files/nas-storage-metrics.sh", dest: nas-storage-metrics.sh }
        - { src: "{{ playbook_dir }}/roles/truenas_monitoring/files/smart-metrics.py", dest: smart-metrics.py }

    - name: Wrapper that starts node_exporter (idempotent) for the TrueNAS init script
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/bin/start-node-exporter.sh"
        mode: "0755"
        content: |
          #!/bin/bash
          pgrep -x node_exporter >/dev/null && exit 0
          nohup {{ monitoring_dir }}/bin/node_exporter \
            --collector.textfile.directory={{ monitoring_dir }}/textfile \
            --web.listen-address=:9100 >/dev/null 2>&1 &
          # runs as the owner of this directory, not root
          # (TrueNAS init scripts run as root: use the "su" form shown in the playbook message)

    - name: Collect ZFS metrics once as a test (no root needed)
      ansible.builtin.command: "{{ monitoring_dir }}/bin/nas-storage-metrics.sh"
      environment:
        OUT_DIR: "{{ monitoring_dir }}/textfile"
      changed_when: true

    - name: What to create in the TrueNAS UI
      ansible.builtin.debug:
        msg:
          - "System Settings > Advanced > Init/Shutdown Scripts > Add: Type Command, When Post Init, Command:"
          - "  su -s /bin/bash {{ ansible_user_id }} -c '{{ monitoring_dir }}/bin/start-node-exporter.sh'"
          - "System Settings > Advanced > Cron Jobs > Add: User root, Schedule */5 * * * *, Command:"
          - "  OUT_DIR={{ monitoring_dir }}/textfile python3 {{ monitoring_dir }}/bin/smart-metrics.py; OUT_DIR={{ monitoring_dir }}/textfile {{ monitoring_dir }}/bin/nas-storage-metrics.sh"
