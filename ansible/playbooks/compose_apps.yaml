- name: Deploy Compose Applications
  hosts: ops
  gather_facts: true
  become: false
  tasks:

    - name: Monitoring Stack
      vars:
        deploy: True
        stack_name: "monitor-stack"
        state: "present"
        application_folders:
          - { "name": 'prometheus', "owner": "{{ main_user }}", "group": "{{ main_user }}", "mode": "0755" }
          - { "name": 'gatus', "owner": "{{ main_user }}", "group": "{{ main_user }}", "mode": "0755" }
          - { "name": 'grafana/dashboards', "owner": "{{ main_user }}", "group": "{{ main_user }}", "mode": "0755" }
          - { "name": 'grafana/provisioning/dashboards', "owner": "{{ main_user }}", "group": "{{ main_user }}", "mode": "0755" }
          - { "name": 'grafana/provisioning/datasources', "owner": "{{ main_user }}", "group": "{{ main_user }}", "mode": "0755" }
          - { "name": 'netalertx/config/', "owner": "{{ main_user }}", "group": "{{ main_user }}", "mode": "0755" }
          - { "name": 'netalertx/db/', "owner": "{{ main_user }}", "group": "{{ main_user }}", "mode": "0755" }
        templates:
          - { "src": "prometheus/prometheus.yml", "dest": "prometheus/prometheus.yml" }
          - { "src": "gatus/config.yaml", "dest": "gatus/config.yaml" }
          - { "src": 'grafana/grafana_dashboard_provisioning.yml', "dest": 'grafana/provisioning/dashboards/dashboard.yml' }
          - { "src": 'grafana/grafana_datasource_provisioning.yml', "dest": 'grafana/provisioning/datasources/datasource.yml' }
        copy_folder_content:
          name: "grafana/dashboards"
          glob: "grafana/dashboards/*.json"
      ansible.builtin.include_role:
        name: compose_apps

    - name: Pi-hole
      vars:
        deploy: True
        stack_name: "pihole"
        state: "present"
        application_folders:
          - { "name": 'pihole', "owner": "{{ main_user }}", "group": "{{ main_user }}", "mode": "0755" }
          - { "name": 'etc-dnsmasq.d', "owner": "root", "group": "root", "mode": "0755" }
        copy_folder_content:
          name: "etc-dnsmasq.d"
          glob: "etc-dnsmasq.d/*"
      ansible.builtin.include_role:
        name: compose_apps

    - name: Tailscale
      vars:
        deploy: True
        stack_name: "tailscale"
        state: "present"
        application_folders:
        - { "name": 'tailscale', "owner": "{{ main_user }}", "group": "{{ main_user }}", "mode": "0755" }
      ansible.builtin.include_role:
          name: compose_apps

    - name: Home Assistant
      vars:
        deploy: True
        stack_name: "ha"
        state: "present"
        application_folders:
          - {"name": 'mosquitto/config', "owner": "root", "group": "root", "mode": "0755"}
          - {"name": '/mosquitto/data', "owner": "root", "group": "root", "mode": "0755"}
          - {"name": '/mosquitto/log', "owner": "root", "group": "root", "mode": "0755"}
          - {"name": '/zigbee2mqtt/data', "owner": "root", "group": "root", "mode": "0755"}
          - {"name": '/homeassistant/data', "owner": "root", "group": "root", "mode": "0755"}
      ansible.builtin.include_role:
        name: compose_apps

    # Reverse proxy for Docker services (label discovery) and TLS passthrough
    # for the k8s ingress.
    - name: Traefik
      vars:
        deploy: True
        stack_name: "traefik"
        state: "present"
        traefik_http_port: 80
        traefik_https_port: 443
        acme_email: "enr.ruggieri.mail@gmail.com"
        k8s_ingress_ip: "192.168.100.111"
        # Talos cluster Cilium Gateway (PROXY protocol v2 keeps the client source IP)
        talos_gateway_ip: "192.168.100.202"
        talos_hostnames:
          - hubble.enricoruggieri.com
        k8s_hostnames:
          - argocd.enricoruggieri.com
          - calibreweb.enricoruggieri.com
          - comfyui.enricoruggieri.com
          - grafana-kube.enricoruggieri.com
          - jackett.enricoruggieri.com
          - jellyfin.enricoruggieri.com
          - joplin.enricoruggieri.com
          - karakeep.enricoruggieri.com
          - navidrome.enricoruggieri.com
          - nextcloud.enricoruggieri.com
          - ollama.enricoruggieri.com
          - onlyoffice.enricoruggieri.com
          - personal.enricoruggieri.com
          - prowlarr.enricoruggieri.com
          - radarr.enricoruggieri.com
          - sonarr.enricoruggieri.com
          - transmission.enricoruggieri.com
          - webui.enricoruggieri.com
        host_services:
          - { "name": "netalertx", "port": 20211 }
          - { "name": "zigbee2mqtt", "url": "http://zigbee2mqtt:8099" }
          - { "name": "pihole", "port": 8083 }
          - { "name": "homeassistant", "port": 8123 }
        application_folders:
          - { "name": 'letsencrypt', "owner": "root", "group": "root", "mode": "0700" }
          - { "name": 'dynamic', "owner": "{{ main_user }}", "group": "{{ main_user }}", "mode": "0755" }
        templates:
          - { "src": "k8s.yml", "dest": "dynamic/k8s.yml" }
          - { "src": "docker-hosts.yml", "dest": "dynamic/docker-hosts.yml" }
      ansible.builtin.include_role:
        name: compose_apps
