---
# Apply netplan with a safety net: a timer restores the previous files if ops stops answering.
- name: Validate netplan
  ansible.builtin.command: netplan generate
  changed_when: false

- name: Clear a rollback timer left by an earlier run
  ansible.builtin.command: systemctl stop netplan-rollback.timer
  changed_when: false
  failed_when: false

- name: Arm the rollback timer
  ansible.builtin.command: >-
    systemd-run --unit=netplan-rollback
    --on-active={{ router_netplan_rollback_seconds }}
    /usr/local/sbin/router-netplan-rollback
  changed_when: true

- name: Apply netplan detached
  ansible.builtin.shell: nohup sh -c 'sleep 2; netplan apply' >/dev/null 2>&1 &
  changed_when: true

- name: Wait until ops answers again
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 60

- name: Disarm the rollback timer
  ansible.builtin.command: systemctl stop netplan-rollback.timer
  changed_when: true
