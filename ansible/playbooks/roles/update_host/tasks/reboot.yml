- name: Tell Telegram the reboot is scheduled (detached)
  delegate_to: localhost
  become: false
  when: update_host_reboot_detached | bool
  uri:
    url: "https://api.telegram.org/bot{{ telegram_bot_token }}/sendMessage"
    method: POST
    body_format: form-urlencoded
    body:
      chat_id: "{{ telegram_chat_id }}"
      text: "Host updates finished, {{ inventory_hostname }} reboots in 1 minute"

- name: Reboot detached (the host running this play)
  ansible.builtin.command: shutdown -r +1 "ansible update_hosts"
  when: update_host_reboot_detached | bool
  changed_when: true

- name: Reboot and wait for the host to return
  ansible.builtin.reboot:
    reboot_timeout: "{{ update_host_reboot_timeout }}"
  when: not (update_host_reboot_detached | bool)

- name: send a telegram after the reboot
  delegate_to: localhost
  become: false
  when: not (update_host_reboot_detached | bool)
  uri:
    url: "https://api.telegram.org/bot{{ telegram_bot_token }}/sendMessage"
    method: POST
    body_format: form-urlencoded
    body:
      chat_id: "{{ telegram_chat_id }}"
      text: "The host {{ inventory_hostname }} was updated and rebooted"
