name: Renovate

# Renovate updates image tags, Helm chart versions and Terraform providers and
# merges them straight into main (branch automerge, no PRs). Config: renovate.json.
# Nightly at 01:30 UTC (02:30/03:30 Amsterdam), Monday to Saturday: Sunday
# night belongs to the host updates (update_hosts.yaml, Sunday 03:00).

on:
  schedule:
    - cron: "30 1 * * 1-6"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run: report what Renovate would do, change nothing"
        type: boolean
        default: false
      logLevel:
        description: "Log level"
        type: choice
        options: [info, debug]
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read
  packages: read # ghcr.io lookups with the job token: anonymous lookups hit 429 rate limits

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_HOST_RULES: >-
            [{"matchHost": "ghcr.io", "hostType": "docker",
              "username": "${{ github.actor }}", "password": "${{ secrets.GITHUB_TOKEN }}"}]
