apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
spec:
  project: cloudflare
  source:
    repoURL: 'https://github.com/enrico-laboratory/homelabV2'
    targetRevision: HEAD
    path: k8s/cloudflare/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflare
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
