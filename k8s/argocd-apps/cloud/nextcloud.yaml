apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
spec:
  project: cloud
  source:
    repoURL: 'https://nextcloud.github.io/helm/'
    chart: nextcloud
    targetRevision: 9.0.6
    helm:
      values: |
        nextcloud:
          host: nextcloud.enricoruggieri.com
          existingSecret:
            enabled: true
            secretName: nextcloud-admin-credentials
            usernameKey: nextcloud-username
            passwordKey: nextcloud-password
          configs:
            z_custom.config.php: |
              <?php
              $CONFIG = array(
                'allow_local_remote_servers' => true,
                'overwriteprotocol' => 'https',
                'overwrite.cli.url' => 'https://nextcloud.enricoruggieri.com',
                'trusted_proxies' => array('10.42.0.0/16', '192.168.100.140'),
                'twofactor_enforced' => 'yes',
                'twofactor_enforced_groups' => array(),
                'twofactor_enforced_excluded_groups' => array(),
              );

          extraVolumes:
            - name: books-nfs
              nfs:
                server: nas.enricoruggieri.com
                path: /tank-data/media/library/books
                readOnly: true

          extraVolumeMounts:
            - name: books-nfs
              mountPath: /mnt/books
              readOnly: true

          lifecycle:
            postStartCommand:
              - "/bin/sh"
              - "-c"
              - |
                su -s /bin/sh www-data -c 'php /var/www/html/occ app:enable files_external' || true
                su -s /bin/sh www-data -c 'php /var/www/html/occ files_external:list' | grep -q 'Books' || \
                  su -s /bin/sh www-data -c 'php /var/www/html/occ files_external:create Books local null::null -c datadir=/mnt/books --user admin'

        persistence:
          enabled: true
          storageClass: proxmox-zfs-nvme
          size: 200Gi

        internalDatabase:
          enabled: false

        externalDatabase:
          existingSecret:
            enabled: true
            secretName: nextcloud-postgres-credentials
            usernameKey: db-username
            passwordKey: password

        postgresql:
          enabled: true
          global:
            postgresql:
              auth:
                database: nextcloud
                username: nextcloud
                existingSecret: nextcloud-postgres-credentials
                secretKeys:
                  userPasswordKey: password
                  adminPasswordKey: postgres-password
          primary:
            persistence:
              enabled: true
              storageClass: proxmox-zfs-nvme

        ingress:
          enabled: true
          className: nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-cloudflare
            nginx.ingress.kubernetes.io/enable-real-ip: "true"
            nginx.ingress.kubernetes.io/proxy-body-size: "10G"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          hosts:
            - host: nextcloud.enricoruggieri.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - nextcloud.enricoruggieri.com
              secretName: nextcloud-tls

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true