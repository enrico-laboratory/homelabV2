apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
spec:
  project: cloud
  source:
    repoURL: 'https://nextcloud.github.io/helm/'
    chart: nextcloud
    targetRevision: 9.0.6
    helm:
      values: |
        nextcloud:
          host: nextcloud.enricoruggieri.com
          existingSecret:
            enabled: true
            secretName: nextcloud-admin-credentials
            usernameKey: nextcloud-username
            passwordKey: nextcloud-password
          configs:
            z_custom.config.php: |
              <?php
              $CONFIG = array(
                'allow_local_remote_servers' => true,
                'overwriteprotocol' => 'https',
                'overwrite.cli.url' => 'https://nextcloud.enricoruggieri.com',
                'trusted_proxies' => array('10.42.0.0/16', '103.21.244.0/22', '103.22.200.0/22', '103.31.4.0/22', '104.16.0.0/13', '104.24.0.0/14', '108.162.192.0/18', '131.0.72.0/22', '141.101.64.0/18', '162.158.0.0/15', '172.64.0.0/13', '173.245.48.0/20', '188.114.96.0/20', '190.93.240.0/20', '197.234.240.0/22', '198.41.128.0/17'),
              );

        persistence:
          enabled: true
          storageClass: proxmox-zfs-nvme
          size: 50Gi

        postgresql:
          enabled: true
          primary:
            persistence:
              enabled: true

        ingress:
          enabled: true
          className: nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-cloudflare
            nginx.ingress.kubernetes.io/enable-real-ip: "true"
            nginx.ingress.kubernetes.io/proxy-body-size: "10G"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          hosts:
            - host: nextcloud.enricoruggieri.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - nextcloud.enricoruggieri.com
              secretName: nextcloud-tls

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true