apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: ai
spec:
  replicas: 0
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
    spec:
      runtimeClassName: nvidia
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: comfyui
          image: ghcr.io/ai-dock/comfyui:latest-cuda
          ports:
            - containerPort: 8188
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: comfyui-data
              mountPath: /workspace
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
      volumes:
        - name: comfyui-data
          persistentVolumeClaim:
            claimName: comfyui-pvc
