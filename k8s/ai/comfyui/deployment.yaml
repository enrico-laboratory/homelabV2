apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: ai
spec:
  replicas: 0
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
    spec:
      runtimeClassName: nvidia
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: comfyui
          image: yanwk/comfyui-boot:cu130-slim-v2
          ports:
            - containerPort: 8188
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: comfyui-models
              mountPath: /root/ComfyUI/models
            - name: comfyui-custom-nodes
              mountPath: /root/ComfyUI/custom_nodes
            - name: comfyui-cache
              mountPath: /root/.cache
            - name: comfyui-config
              mountPath: /root/.config
            - name: comfyui-output
              mountPath: /root/ComfyUI/output
            - name: comfyui-input
              mountPath: /root/ComfyUI/input
            - name: comfyui-user
              mountPath: /root/ComfyUI/user
            - name: comfyui-user-scripts
              mountPath: /root/user-scripts
      volumes:
        - name: comfyui-models
          persistentVolumeClaim:
            claimName: comfyui-models-pvc
        - name: comfyui-custom-nodes
          persistentVolumeClaim:
            claimName: comfyui-custom-nodes-pvc
        - name: comfyui-cache
          persistentVolumeClaim:
            claimName: comfyui-cache-pvc
        - name: comfyui-config
          persistentVolumeClaim:
            claimName: comfyui-config-pvc
        - name: comfyui-output
          nfs:
            server: nas.enricoruggieri.com
            path: /tank-data/comfyui/output
        - name: comfyui-input
          nfs:
            server: nas.enricoruggieri.com
            path: /tank-data/comfyui/input
        - name: comfyui-user
          nfs:
            server: nas.enricoruggieri.com
            path: /tank-data/comfyui/user
        - name: comfyui-user-scripts
          nfs:
            server: nas.enricoruggieri.com
            path: /tank-data/comfyui/user-scripts
