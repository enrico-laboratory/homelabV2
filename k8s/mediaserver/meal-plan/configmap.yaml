  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Meal Plan</title>
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: Georgia, serif;
          background: #faf9f7;
          color: #2c2c2c;
          padding: 1.5rem;
        }
        .page {
          max-width: 1100px;
          margin: 0 auto;
        }
        h1 {
          font-size: 1.8rem;
          font-weight: normal;
          letter-spacing: 0.03em;
          margin-bottom: 0.3rem;
        }
        .subtitle {
          color: #888;
          font-size: 0.85rem;
          margin-bottom: 1.2rem;
        }
    
        /* Tab switcher */
        .plan-tabs {
          display: flex;
          gap: 0;
          margin-bottom: 2rem;
          border-bottom: 2px solid #ddd;
        }
        .plan-tab {
          font-family: Georgia, serif;
          font-size: 0.82rem;
          letter-spacing: 0.07em;
          text-transform: uppercase;
          color: #aaa;
          background: none;
          border: none;
          border-bottom: 2px solid transparent;
          margin-bottom: -2px;
          padding: 0.5rem 1.2rem 0.5rem 0;
          cursor: pointer;
          transition: color 0.15s;
        }
        .plan-tab:hover { color: #555; }
        .plan-tab.active {
          color: #2c2c2c;
          border-bottom-color: #2c2c2c;
        }
        .plan-section { display: none; }
        .plan-section.active { display: block; }
    
        .desktop-table {
          width: 100%;
          border-collapse: collapse;
          margin-bottom: 2.5rem;
        }
        .desktop-table thead th {
          text-align: left;
          padding: 0.6rem 0.8rem;
          font-size: 0.78rem;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          color: #666;
          border-bottom: 2px solid #ddd;
        }
        .desktop-table thead th.meal-col { width: 90px; }
        .desktop-table tbody tr { border-bottom: 1px solid #eee; }
        .desktop-table tbody tr:last-child { border-bottom: none; }
        .desktop-table td { padding: 0.75rem 0.8rem; vertical-align: top; }
        .desktop-table td.meal-label {
          font-size: 0.75rem;
          text-transform: uppercase;
          letter-spacing: 0.06em;
          color: #999;
          padding-top: 0.95rem;
          white-space: nowrap;
        }
        .mobile-days { display: none; }
        .day-card {
          background: #fff;
          border: 1px solid #e8e5e0;
          border-radius: 6px;
          margin-bottom: 1.2rem;
          overflow: hidden;
        }
        .day-card h2 {
          font-size: 0.78rem;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          color: #666;
          padding: 0.6rem 1rem;
          background: #f5f3f0;
          border-bottom: 1px solid #e8e5e0;
          font-weight: normal;
        }
        .meal-row {
          display: grid;
          grid-template-columns: 70px 1fr;
          border-bottom: 1px solid #eee;
          padding: 0.7rem 1rem;
          gap: 0.5rem;
          align-items: start;
        }
        .meal-row:last-child { border-bottom: none; }
        .meal-row .label {
          font-size: 0.72rem;
          text-transform: uppercase;
          letter-spacing: 0.06em;
          color: #aaa;
          padding-top: 0.1rem;
        }
        .recipe-link {
          display: block;
          color: #2c2c2c;
          text-decoration: none;
          font-size: 0.93rem;
          line-height: 1.35;
        }
        .recipe-link:hover { color: #7b5e3a; text-decoration: underline; }
        .fermented {
          font-size: 0.78rem;
          color: #888;
          font-style: italic;
          margin-top: 0.25rem;
        }
        .tags {
          margin-top: 0.3rem;
          display: flex;
          flex-wrap: wrap;
          gap: 0.3rem;
        }
        .tag {
          font-size: 0.68rem;
          padding: 0.12rem 0.38rem;
          border-radius: 2px;
          background: #eee;
          color: #666;
        }
        .tag.nocook { background: #e8f4e8; color: #4a7a4a; }
        .tag.fast   { background: #fef3e2; color: #8a6020; }
        .tag.it     { background: #f0eaf8; color: #5a3e8a; }
        .tag.me     { background: #fde8ec; color: #8a3050; }
        .tag.veg    { background: #e4f5e4; color: #2e6b2e; }
        hr { border: none; border-top: 1px solid #ddd; margin: 2rem 0; }
        .habits {
          font-size: 0.86rem;
          color: #555;
          margin-bottom: 1.5rem;
        }
        .habits h2 {
          font-size: 0.75rem;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          color: #999;
          margin-bottom: 0.7rem;
          font-weight: normal;
        }
        .habits ul { list-style: none; }
        .habits li { padding: 0.2rem 0; }
        .habits li::before { content: "— "; color: #bbb; }
        @media (max-width: 700px) {
          body { padding: 1rem; }
          h1 { font-size: 1.4rem; }
          .desktop-table { display: none; }
          .mobile-days { display: block; }
          .habits ul { display: flex; flex-direction: column; gap: 0.1rem; }
        }
      </style>
    </head>
