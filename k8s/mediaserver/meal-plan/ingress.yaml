apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meal-plan
  namespace: mediaserver
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: nginx
  rules:
    - host: "personal.enricoruggieri.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: meal-plan-service
                port:
                  number: 80
  tls:
    - hosts:
        - personal.enricoruggieri.com
      secretName: personal-cert-tls
