# Nightly Nextcloud backup to TrueNAS (restic over NFS).
#   1. warm   : online restic backup of the data PVC (bulk copy, no downtime)
#   2. maint  : maintenance mode on
#   3. dump   : pg_dump of the database
#   4. final  : restic backup of the PVC + dump (fast, incremental), then retention
#   5. main   : maintenance mode off (always runs; fails the job if a step failed)
# Steps 1, 3 and 4 never abort the pod, so maintenance mode is always lifted.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-backup
  namespace: cloud
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 43200
      template:
        spec:
          restartPolicy: Never
          # The data PVC is ReadWriteOnce: run on the same node as Nextcloud.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: nextcloud
                      app.kubernetes.io/component: app
          initContainers:
            - name: restic-warm
              image: restic/restic:0.18.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  restic cat config >/dev/null 2>&1 || restic init || { touch /status/failed; exit 0; }
                  restic backup /var/www/html --tag warm --host nextcloud \
                    --exclude 'data/appdata_*/preview' --exclude 'data/*.log' \
                    || touch /status/failed
                  exit 0
              env: &resticEnv
                - { name: RESTIC_REPOSITORY, value: /repo }
                - { name: RESTIC_CACHE_DIR, value: /cache }
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-backup-restic
                      key: password
              volumeMounts: &resticMounts
                - { name: nextcloud-data, mountPath: /var/www/html, readOnly: true }
                - { name: dump, mountPath: /dump }
                - { name: status, mountPath: /status }
                - { name: cache, mountPath: /cache }
                - { name: repo, mountPath: /repo }
            - name: maintenance-on
              image: nextcloud:35.0.2-apache
              command: ["/bin/sh", "-c"]
              args:
                - su -s /bin/sh www-data -c 'php /var/www/html/occ maintenance:mode --on'
              # Same subPath layout as the Nextcloud chart: the PVC root is not the web root.
              volumeMounts:
                - { name: nextcloud-data, mountPath: /var/www, subPath: root }
                - { name: nextcloud-data, mountPath: /var/www/html, subPath: html }
                - { name: nextcloud-data, mountPath: /var/www/html/data, subPath: data }
                - { name: nextcloud-data, mountPath: /var/www/html/config, subPath: config }
                - { name: nextcloud-data, mountPath: /var/www/html/custom_apps, subPath: custom_apps }
                - { name: nextcloud-data, mountPath: /var/www/html/themes, subPath: themes }
                - { name: nextcloud-data, mountPath: /var/www/tmp, subPath: tmp }
            - name: pg-dump
              image: postgres:17-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  pg_dump -h nextcloud-postgresql -U nextcloud -d nextcloud -Fc -f /dump/nextcloud.dump \
                    || touch /status/failed
                  exit 0
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-postgres-credentials
                      key: password
              volumeMounts:
                - { name: dump, mountPath: /dump }
                - { name: status, mountPath: /status }
            - name: restic-final
              image: restic/restic:0.18.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  restic backup /var/www/html /dump --tag final --host nextcloud \
                    --exclude 'data/appdata_*/preview' --exclude 'data/*.log' \
                    || { touch /status/failed; exit 0; }
                  restic forget --tag warm --keep-last 1 || touch /status/failed
                  restic forget --tag final --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune \
                    || touch /status/failed
                  exit 0
              env: *resticEnv
              volumeMounts: *resticMounts
          containers:
            - name: maintenance-off
              image: nextcloud:35.0.2-apache
              command: ["/bin/sh", "-c"]
              args:
                - |
                  su -s /bin/sh www-data -c 'php /var/www/html/occ maintenance:mode --off' || exit 1
                  if [ -e /status/failed ]; then echo "backup step failed, see init container logs"; exit 1; fi
              volumeMounts:
                - { name: nextcloud-data, mountPath: /var/www, subPath: root }
                - { name: nextcloud-data, mountPath: /var/www/html, subPath: html }
                - { name: nextcloud-data, mountPath: /var/www/html/data, subPath: data }
                - { name: nextcloud-data, mountPath: /var/www/html/config, subPath: config }
                - { name: nextcloud-data, mountPath: /var/www/html/custom_apps, subPath: custom_apps }
                - { name: nextcloud-data, mountPath: /var/www/html/themes, subPath: themes }
                - { name: nextcloud-data, mountPath: /var/www/tmp, subPath: tmp }
                - { name: status, mountPath: /status }
          volumes:
            - name: nextcloud-data
              persistentVolumeClaim:
                claimName: nextcloud-nextcloud
            - name: repo
              nfs:
                server: truenas-backup.enricoruggieri.com
                path: /mnt/backup-pool-2/nextcloud
            - name: dump
              emptyDir: {}
            - name: status
              emptyDir: {}
            - name: cache
              emptyDir: {}
